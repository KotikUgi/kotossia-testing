
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 1. The wrapper limits the image boundaries */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        main {
            margin: 15;
            padding: 0;
            box-sizing: border-box;
        }
        .img-container {
            width: 396px;
            height: 98px;
            border-radius: 8px; /* Optional rounded corners */
        }

        /* 2. Default state of the image */
        .img-container img {
            width: 100%;
            height: 100%;
            transition: transform 0.1s cubic-bezier(0, 0, 0.2, 1); /* Makes the zoom smooth */
        }

        /* 3. The hover effect trigger */
        .img-container:hover img {
            transform: scale(1.01); /* Zooms in by 20% */
        }
        header {
            /* Syntax: linear-gradient(direction, color1, color2, color3) */
            background: linear-gradient(90deg, #e2b111 33%, #7bceff 0 66%, #be1b1b 0);
            background: linear-gradient(
                90deg, 
                #fff4d1 0%, 
                #fff4d1 32%, /* End first color */
                #e1f4ff 34%, /* Start second color */
                #e1f4ff 65%, /* End second color */
                #ffd1d1 67%, /* Start third color */
                #ffd1d1 100%
            );
            padding: 40px 20px;
            color: white;
            text-align: center;
        }
        body {
            font-family: Verdana, sans-serif;
        }
        platform-img {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <header style="display: flex; justify-content: space-between; align-items: center; width: 100%; box-sizing: border-box; padding: 10px 20px; background-color: #ffffff;">
        <div class="img-container">
            <img src="https://raw.githubusercontent.com/KotikUgi/kotossia/main/kotossia logo.png" alt="В Главную страницу">
        </div>
        <nav>
        <ul style="display: flex; list-style: none; margin: 0; padding: 0; gap: 20px;">
        <li><a href="https://kotikugi.github.io/kotossia-testing/main" style="text-decoration: none; color: #333;">Главная</a></li>
        <li><a href="https://kotikugi.github.io/kotossia-testing/news" style="text-decoration: none; color: #333;">Новости</a></li>
        <li><a href="https://kotikugi.github.io/kotossia-testing/president-history" style="text-decoration: none; color: #333;">История президентов</a></li>
        <li><a href="https://kotikugi.github.io/kotossia-testing/map" style="text-decoration: none; color: #333;">Карта Котоссии</a></li>
        <li><a href="https://kotikugi.github.io/kotossia-testing/cities" style="text-decoration: none; color: #333;">Города Котоссии</a></li>
        </ul>
    </nav>
        <script>
            // 1. Get the "Raw" URL from your GitHub repository
            const url = 'https://raw.githubusercontent.com/KotikUgi/kotossia/main/test file';

            // 2. Fetch the data and display it
            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.text();
                })
                .then(data => {
                    document.getElementById('file-content').textContent = data;
                })
                .catch(error => {
                    document.getElementById('file-content').textContent = 'Error loading file: ' + error.message;
                });
        </script>
    <script>
async function loadLatestNews() {
  const container = document.querySelector('.latest-news');
  if (!container) return;
  container.innerHTML = '<p>грузим :33</p>';

  // 1. Быстрый бинарный поиск последней новости за O(log N)
  let low = 1;
  let high = 500;
  let highestNumber = 0;

  while (low <= high) {
    const mid = Math.floor((low + high) / 2);
    try {
      const response = await fetch(`../${mid}.txt`, { method: 'HEAD' });
      if (response.ok) {
        highestNumber = mid;
        low = mid + 1;
      } else {
        high = mid - 1;
      }
    } catch {
      high = mid - 1;
    }
  }

  if (highestNumber === 0) {
    container.innerHTML = '<p>Новости не найдены.</p>';
    return;
  }

  container.innerHTML = ''; // Очищаем индикатор загрузки

  let isFirstNews = true;

  // 2. Цикл загрузки всех новостей от highestNumber до 1
  for (let currentId = highestNumber; currentId >= 1; currentId--) {
    let textContent = '';
    let dateContent = '';
    const images = [];
    const maxImagesToCheck = 10;

    // Запросы на проверку картинок
    const imagePromises = Array.from({ length: maxImagesToCheck }, (_, i) => {
      const index = i + 1;
      const pngPath = `../${currentId}_${index}.png`;
      const jpgPath = `../${currentId}_${index}.jpg`;

      return fetch(pngPath, { method: 'HEAD' })
        .then(res => res.ok ? pngPath : fetch(jpgPath, { method: 'HEAD' }).then(resJpg => resJpg.ok ? jpgPath : null))
        .catch(() => null);
    });

    // Запрос на загрузку основного текста
    const textPromise = fetch(`../${currentId}.txt`)
      .then(res => res.ok ? res.text() : '')
      .catch(e => {
        console.error(`Ошибка загрузки текста для новости №${currentId}:`, e);
        return '';
      });

    // Запрос на загрузку даты новости
    const datePromise = fetch(`../${currentId}_date.txt`)
      .then(res => res.ok ? res.text() : '')
      .catch(e => {
        console.error(`Ошибка загрузки даты для новости №${currentId}:`, e);
        return '';
      });

    try {
      // Запускаем ВСЕ запросы (текст, дата, картинки) параллельно
      const [fetchedText, fetchedDate, checkedImages] = await Promise.all([
        textPromise,
        datePromise,
        Promise.all(imagePromises)
      ]);
      
      textContent = fetchedText;
      dateContent = fetchedDate.trim(); // Убираем лишние пробелы и переносы строк
      images.push(...checkedImages.filter(path => path !== null));
    } catch (e) {
      console.error(`Ошибка загрузки данных для новости №${currentId}:`, e);
      continue;
    }

    // Если нет вообще ничего — пропускаем новость
    if (!textContent && !dateContent && images.length === 0) continue;

    // Добавляем разделительную линию между новостями
    if (!isFirstNews) {
      const hr = document.createElement('hr');
      hr.style.width = '100%';
      hr.style.margin = '30px 0';
      hr.style.border = 'none';
      hr.style.borderTop = '1px solid #ccc';
      container.appendChild(hr);
    }
    
    isFirstNews = false;

    // 3. Создаем HTML-структуру для текущей новости
    const newsItem = document.createElement('div');
    newsItem.className = 'news-item';
    newsItem.style.display = 'flex';
    newsItem.style.flexDirection = 'column';
    newsItem.style.alignItems = 'center';
    newsItem.style.width = '100%';

    // Выводим картинки, если они есть
    if (images.length > 0) {
      const row = document.createElement('div');
      row.className = 'news-images-row';
      row.style.display = 'flex';
      row.style.gap = '10px';
      row.style.flexWrap = 'nowrap';
      row.style.alignItems = 'stretch';
      row.style.justifyContent = 'center';
      row.style.width = '100%';

      images.forEach((src, index) => {
        const img = document.createElement('img');
        img.src = src;
        img.style.width = 'calc(25% - 7.5px)';
        img.style.objectFit = 'cover';
        img.style.objectPosition = 'center';
        if (index === 0) {
          img.style.height = 'auto';
        } else {
          img.style.height = '100%';
        }
        row.appendChild(img);
      });
      newsItem.appendChild(row);
    }

    // Выводим дату, если файл успешно загрузился и он не пустой
    if (dateContent) {
      const dateElement = document.createElement('span');
      dateElement.className = 'news-date';
      dateElement.innerText = dateContent;
      dateElement.style.textAlign = 'center';
      dateElement.style.fontSize = '0.85em'; // Слегка уменьшенный шрифт
      dateElement.style.color = '#666';       // Серый цвет для даты
      dateElement.style.marginTop = '15px';
      dateElement.style.fontWeight = 'bold';
      newsItem.appendChild(dateElement);
    }

    // Выводим основной текст новости
    if (textContent) {
      const textElement = document.createElement('p');
      textElement.className = 'news-text';
      textElement.innerText = textContent;
      textElement.style.textAlign = 'center';
      textElement.style.width = '100%';
      // Если дата есть, делаем отступ поменьше, если даты нет — стандартный
      textElement.style.marginTop = dateContent ? '5px' : '15px';
      newsItem.appendChild(textElement);
    }

    container.appendChild(newsItem);
  }
}

document.addEventListener('DOMContentLoaded', loadLatestNews);

    </script>
    </header>
    <main>
<!-- Wrapper container to align columns consistently -->
        <h1 style="text-align: center; justify-content: flex-end;">Все новости</h1>
        <br>
        <p style="text-align: center; width: 50%; margin: 0 auto; color: red;">Форматированние текста может быть неверным с новостей от 23 декабря 2023 до 5 июня 2026</p>
        <br>
        <div class="latest-news" style="display: flex; justify-content: center; flex-wrap: wrap;"></div>
    </main>
</body>
